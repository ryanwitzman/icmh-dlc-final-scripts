name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    env:
      TENANT_ID: dummy-tenant-id
      CLIENT_ID: dummy-client-id
      CLIENT_SECRET: dummy-client-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install black flake8 pyyaml snakemake python-dotenv msal requests tqdm

      - name: Check formatting (black)
        run: black --check src/

      - name: Lint (flake8)
        run: flake8 src/ --max-line-length=100

      - name: Validate config.yaml
        run: |
          python - <<'EOF'
          import yaml, sys
          required_keys = [
            "trim_start_seconds",
            "fps",
            "trim_duration_seconds",
            "output_codec",
            "frame_rate_handling_policy",
            "output_dir_path",
            "sharepoint_url",
            "remote_path",
            "staging_dir",
            "batch_id",
          ]
          with open("configs/config.yaml") as f:
              cfg = yaml.safe_load(f)
          missing = [k for k in required_keys if k not in cfg]
          if missing:
              print(f"ERROR: Missing keys in config.yaml: {missing}")
              sys.exit(1)
          print("config.yaml is valid.")
          EOF

      - name: Create dummy .env for dry-run
        run: |
          cat > .env <<EOF
          TENANT_ID=dummy-tenant-id
          CLIENT_ID=dummy-client-id
          CLIENT_SECRET=dummy-client-secret
          EOF

      - name: Snakemake dry-run
        run: |
          mkdir -p inputs staging outputs
          touch staging/test_video.mp4
          snakemake --directory workflow/ --cores 1 --dry-run